description: >-
  ManoMano is Europe's leading online marketplace dedicated to DIY, home
  improvement and gardening, operating consumer storefronts across France,
  Germany, Italy, Spain and the United Kingdom plus a ManoManoPro offering for
  construction professionals and craftsmen. Founded in France and backed by
  Partech, it connects millions of DIY, tools, heating, electrical, kitchen,
  bathroom, flooring and garden products from thousands of third-party sellers
  and brands to individuals and trade buyers. This API Evangelist profile was
